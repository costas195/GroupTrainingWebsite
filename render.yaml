# Live deployment. Keep demos on a separate service/database using render.demo.yaml.
services:
  - type: web
    name: nf-hybrid-portal-production
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python manage.py init-db
    startCommand: gunicorn --workers 2 --threads 2 --bind 0.0.0.0:$PORT --access-logfile - --error-logfile - --timeout 60 app:app
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_MIGRATE
        value: "false"
      - key: DATABASE_SSLMODE
        value: require
      - key: DATABASE_URL
        fromDatabase:
          name: nf-hybrid-production-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "false"
      - key: GYM_TIMEZONE
        value: Asia/Nicosia
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: SMS_PROVIDER
        value: websms
      - key: WEBSMS_API_KEY
        sync: false
      - key: WEBSMS_SENDER
        value: NF Hybrid

databases:
  - name: nf-hybrid-production-db
    databaseName: nf_hybrid
    user: nf_hybrid
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "17"
    ipAllowList: []
