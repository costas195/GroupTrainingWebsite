services:
  - type: web
    name: form-gym-portal-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: development
      - key: DEMO_MODE
        value: "true"
      - key: GYM_TIMEZONE
        value: Asia/Nicosia
